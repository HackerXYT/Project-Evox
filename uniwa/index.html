<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name='viewport' content='width=device-width, initial-scale=1 , user-scalable=no'>
    <title>EduVox</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="outer.css">
    <link rel="apple-touch-icon-precomposed" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="single.png">
</head>

<body>
    <div class="drawer" id="drawer">
        <div class="fullRow" style="gap: 10px;">
            <img onclick="closeDrawer()" src="logoWhite.png">
            EduVox
        </div>
        <div class="tab">
            Αρχική
        </div>
        <div class="tab">
            Λογαριασμός
        </div>
        <div class="tab">
            Αποσύνδεση
        </div>
        <div onclick="closeDrawer()" class="tab cc">
            Κλείσιμο
        </div>
        <div class="tab ">
            <p>Οι ειδοποιήσεις είναι <vox id="statusNotif" style="color: rgb(255, 92, 92);">ανενεργές</vox>
            </p>
            <div class="toggle-switch">
                <label class="switch-label">
                    <input onclick="toggleNotifications(this, event)" id="notificationsToggle" type="checkbox"
                        class="checkbox">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>
    <div class="main columnGeneral" style="display: none;" id="home">
        <div class="fullRow around">
            <div class="pfp">
                <img src="https://wallpapers.com/images/hd/blank-default-pfp-wue0zko1dfxs9z2c.jpg">
            </div>
            <div onclick="openDrawer()" class="sidebarToggle">
                <svg xmlns="http://www.w3.org/2000/svg" width="25px" height="25px" viewBox="0 0 24 24" fill="none">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                        d="M9.94358 2.25C8.10583 2.24998 6.65019 2.24997 5.51098 2.40314C4.33856 2.56076 3.38961 2.89288 2.64124 3.64124C1.89288 4.38961 1.56076 5.33856 1.40314 6.51098C1.24997 7.65019 1.24998 9.10582 1.25 10.9436V13.0564C1.24998 14.8942 1.24997 16.3498 1.40314 17.489C1.56076 18.6614 1.89288 19.6104 2.64124 20.3588C3.38961 21.1071 4.33856 21.4392 5.51098 21.5969C6.65018 21.75 8.1058 21.75 9.94354 21.75H14.0564C14.3706 21.75 14.6738 21.75 14.966 21.7492C14.9773 21.7497 14.9886 21.75 15 21.75C15.0129 21.75 15.0257 21.7497 15.0384 21.749C16.4224 21.7448 17.5607 21.7217 18.489 21.5969C19.6614 21.4392 20.6104 21.1071 21.3588 20.3588C22.1071 19.6104 22.4392 18.6614 22.5969 17.489C22.75 16.3498 22.75 14.8942 22.75 13.0565V10.9436C22.75 9.10585 22.75 7.65018 22.5969 6.51098C22.4392 5.33856 22.1071 4.38961 21.3588 3.64124C20.6104 2.89288 19.6614 2.56076 18.489 2.40314C17.5607 2.27833 16.4224 2.25523 15.0384 2.25096C15.0257 2.25032 15.0129 2.25 15 2.25C14.9886 2.25 14.9773 2.25025 14.966 2.25076C14.6737 2.25 14.3707 2.25 14.0564 2.25H9.94358ZM14.25 3.75002C14.1677 3.75 14.0844 3.75 14 3.75H10C8.09318 3.75 6.73851 3.75159 5.71085 3.88976C4.70476 4.02503 4.12511 4.27869 3.7019 4.7019C3.27869 5.12511 3.02503 5.70476 2.88976 6.71085C2.75159 7.73851 2.75 9.09318 2.75 11V13C2.75 14.9068 2.75159 16.2615 2.88976 17.2892C3.02503 18.2952 3.27869 18.8749 3.7019 19.2981C4.12511 19.7213 4.70476 19.975 5.71085 20.1102C6.73851 20.2484 8.09318 20.25 10 20.25H14C14.0844 20.25 14.1677 20.25 14.25 20.25L14.25 3.75002ZM15.75 20.2443C16.7836 20.2334 17.6082 20.2018 18.2892 20.1102C19.2952 19.975 19.8749 19.7213 20.2981 19.2981C20.7213 18.8749 20.975 18.2952 21.1102 17.2892C21.2484 16.2615 21.25 14.9068 21.25 13V11C21.25 9.09318 21.2484 7.73851 21.1102 6.71085C20.975 5.70476 20.7213 5.12511 20.2981 4.7019C19.8749 4.27869 19.2952 4.02503 18.2892 3.88976C17.6082 3.79821 16.7836 3.76662 15.75 3.75573L15.75 20.2443Z"
                        fill="#fff" />
                </svg>
            </div>
        </div>
        <div class="fullRow">
            <p class="header">Τι θα κάνεις σήμερα;</p>
        </div>
        <div class="fullRow">
            <div class="search-container">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" name="moodle_search_unique_xyz" autocomplete="one-time-code"
                    placeholder="Αναζήτησε στο Moodle" class="search-input" readonly id="search-moodle">
            </div>
        </div>
        <div class="fullRow">
            <p class="cat_name">Μαθήματα</p>
        </div>
        <div id="coursesContainer" class="fullRow carousel">
            <div class="card skeleton"></div>
            <div class="card skeleton"></div>
            <div class="card skeleton"></div>
            <div class="card skeleton"></div>
        </div>
        <div class="announcements">
            <div class="fullRow">
                <p class="cat_name">Ανακοινώσεις</p>
            </div>

            <div class="announcementsContainer" id="announcementsContainer">
                <div class="announcement skeleton"></div>
                <div class="announcement skeleton"></div>
                <div class="announcement skeleton"></div>
                <div class="announcement skeleton"></div>
                <div class="announcement skeleton"></div>
            </div>
        </div>
    </div>
    <div class="main columnCentered" style="display: none;" id="main">
        <p>Οι ειδοποιήσεις είναι <vox id="statusNotif" style="color: rgb(255, 92, 92);">ανενεργές</vox>
        </p>
        <div class="toggle-switch">
            <label class="switch-label">
                <input onclick="toggleNotifications(this, event)" id="notificationsToggle" type="checkbox"
                    class="checkbox">
                <span class="slider"></span>
            </label>
        </div>
        <div class="bottom">
            Συνδεδεμένος χρήστης
            <br>
            <vox id="name-username">name - username</vox>
        </div>
    </div>
    <div class="setup columnCentered" style="display: none;" id="setup">
        <img src="logoWhite.png">
        <h3>Σύνδεση</h3>
        <div class="group splitSection">
            <svg stroke="currentColor" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="icon">
                <path
                    d="M20 21C20 18.2386 16.4183 16 12 16C7.58172 16 4 18.2386 4 21M12 13C9.23858 13 7 10.7614 7 8C7 5.23858 9.23858 3 12 3C14.7614 3 17 5.23858 17 8C17 10.7614 14.7614 13 12 13Z"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <input id="username" class="input" type="name" placeholder="Όνομα χρήστη">
        </div>
        <div class="group">
            <svg stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                class="icon">
                <path
                    d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"
                    stroke-linejoin="round" stroke-linecap="round"></path>
            </svg>
            <input id="password" class="input" type="password" placeholder="Κωδικός πρόσβασης">
        </div>

        <button onclick="login()" class="splitSection">
            Σύνδεση
            <div class="arrow-wrapper">
                <div class="arrow"></div>

            </div>
        </button>
        <span class="notice-text">Ο κωδικός σας δεν αποθηκεύεται ποτέ.<br>Τα
            δεδομένα σας είναι ασφαλή.</span>
    </div>
    <div id="generalLoading" class="columnCentered">
        <div class="loader"></div>
        <span id="welcomeMsg" class="notice-text popin normalSize" style="display: none;">Καλωσόρισες, <vox id="name">
            </vox></span>
    </div>
    <canvas id="c" width="64" height="64" style="display:none"></canvas>
</body>
<script src="helpers.js"></script>
<script src="announcements.js"></script>
<script src="script.js"></script>

</html>
