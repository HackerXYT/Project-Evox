<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name='viewport'
            content='width=device-width, initial-scale=1 , user-scalable=no'>
        <title>Moodlevox</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="outer.css">
        <link rel="apple-touch-icon-precomposed" href="logo.png">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style"
            content="black-translucent">
    </head>
    <body>
        <div class="main columnCentered" style="display: none;" id="main">
            <p>Οι ειδοποιήσεις είναι <vox id="statusNotif" style="color: rgb(255, 92, 92);">ανενεργές</vox></p>
            <div class="toggle-switch">
                <label class="switch-label">
                    <input onclick="toggleNotifications(this, event)"  id="notificationsToggle" type="checkbox" class="checkbox">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="bottom">
                Συνδεδεμένος χρήστης
                <br>
                <vox id="name-username">name - username</vox>
            </div>
        </div>
        <div class="setup columnCentered" style="display: none;" id="setup">
            <img src="logoWhite.png">
            <h3>Σύνδεση</h3>
            <div class="group splitSection">
                <svg stroke="currentColor" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24" fill="none" class="icon">
                    <path
                        d="M20 21C20 18.2386 16.4183 16 12 16C7.58172 16 4 18.2386 4 21M12 13C9.23858 13 7 10.7614 7 8C7 5.23858 9.23858 3 12 3C14.7614 3 17 5.23858 17 8C17 10.7614 14.7614 13 12 13Z"
                        stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <input id="username" class="input" type="name"
                    placeholder="Όνομα χρήστη">
            </div>
            <div class="group">
                <svg stroke="currentColor" stroke-width="1.5"
                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
                    class="icon">
                    <path
                        d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"
                        stroke-linejoin="round" stroke-linecap="round"></path>
                </svg>
                <input id="password" class="input" type="password"
                    placeholder="Κωδικός πρόσβασης">
            </div>

            <button onclick="login()" class="splitSection">
                Σύνδεση
                <div class="arrow-wrapper">
                    <div class="arrow"></div>

                </div>
            </button>
            <span class="notice-text">Ο κωδικός σας δεν αποθηκεύεται ποτέ.<br>Τα
                δεδομένα σας είναι ασφαλή.</span>
        </div>
        <div id="generalLoading" class="columnCentered">
            <div class="loader"></div>
            <span id="welcomeMsg" class="notice-text popin normalSize"
                style="display: none;">Καλωσόρισες, <vox id="name"></vox></span>
        </div>
    </body>
    <script src="helpers.js"></script>
    <script src="script.js"></script>
</html>
