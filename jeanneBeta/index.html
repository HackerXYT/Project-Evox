        .copyright {

            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            font-size: 12px;
            color: #888;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px;
            background: rgb(22, 22, 22);
        }

        .copyright p {
            font-family: apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            text-align: center;
            margin: 0;
            padding-left: 40px;
            padding-right: 40px;
            box-sizing: border-box;
        }

        .copyright p.bold {
            font-weight: bold;
        }

        .copyright.is-animating {
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .copyright svg {
            opacity: 0;
            transform: scale(0);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1),
                transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .copyright svg.scale-in {
            opacity: 1;
            transform: scale(1);
        }

        .copyright p {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1),
                transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .copyright p.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .copyright .copyright-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #1f1f1f;
            color: #cecece;
            border: none;
            border-radius: 25px;
            font-family: apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
            box-sizing: border-box;

            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1),
                transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .copyright .copyright-button.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

    <div class="copyright">

        <p>This Evox project is temporarily unavailable due to copyright protection.</p>
        <p class="bold">Need help or want a demo?</p>
        <p>Account deletion & support:<br>support@evoxs.xyz</p>
        <p>Demo requests & pricing:<br>admin@evoxs.xyz</p>
        <div onclick="downloadData()" class="copyright-button">
            Download your data
        </div>
    </div>
</body>

<script>

    window.addEventListener("load", async () => {
        if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (const registration of registrations) {
                await registration.unregister();
            }
        }

        if ("caches" in window) {
            const names = await caches.keys();
            for (const name of names) {
                await caches.delete(name);
            }
        }

        console.log("Service workers and caches cleared");
    });

    document.addEventListener("DOMContentLoaded", () => {
        const container = document.querySelector('.copyright');
        const svg = document.querySelector('.copyright svg');
        const paragraphs = document.querySelectorAll('.copyright p');
        const divs = document.querySelectorAll('.copyright div');

        const svgCenterY = svg.offsetTop + (svg.offsetHeight / 2);
        const viewportCenterY = window.innerHeight / 2;
        const yOffset = viewportCenterY - svgCenterY;

        container.style.transform = `translateY(${yOffset}px)`;

        void container.offsetWidth;

        container.classList.add('is-animating');

        setTimeout(() => {
            svg.classList.add('scale-in');
        }, 150);

        setTimeout(() => {
            container.style.transform = `translateY(0)`;
        }, 1000);

        if (!localStorage.getItem("jeanDarc_accountData")) {
            divs.forEach((div, index) => {
                div.style.display = "none";

            });
        }

        paragraphs.forEach((p, index) => {
            setTimeout(() => {
                p.classList.add('is-visible');

                if (index === paragraphs.length - 1 && localStorage.getItem("jeanDarc_accountData")) {
                    divs.forEach((div, index) => {
                        div.classList.add('is-visible');

                    });
                }
            }, 1150 + (index * 120));
        });
    });

    function downloadData() {
        const data = localStorage.getItem("jeanDarc_accountData");
        const json = JSON.parse(data);
        const emri = json.name
        const pin = atob(json.pin)
        fetch(`https://arc.evoxs.xyz/?metode=downloadData&emri=${emri}&pin=${pin}`, {
            method: 'GET',
            headers: {
                'Content-Type': 'application/json',
            },
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                if (data.message === "200") {
                    sessionStorage.setItem("AccountData", JSON.stringify(data));
                    window.location.href = "viewAccount.html";
                } else {
                    alert("Failed to download data: " + data.message);
                }
            })
            .catch(error => {
                alert("An error occurred while downloading your data. Please try again later.");
            })
    }
</script>
